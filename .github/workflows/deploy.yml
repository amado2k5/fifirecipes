name: Deploy fifi.cooking to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made by a workflow do not trigger this one, so redeploy after the
  # weekly video refresh commits new results.
  workflow_run:
    workflows: [Refresh recipe videos]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build site
        run: npm run build
      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1
          # Preserve .well-known/ for iOS Universal Links and Android App Links
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=fifi-cooking

  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate sitemap
        run: npx tsx scripts/generate-public-index.ts
      - name: Submit URLs to IndexNow
        run: npm run indexnow
