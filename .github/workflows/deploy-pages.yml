name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pushes made by a workflow do not trigger this one, so redeploy after the
  # weekly video refresh commits new results.
  workflow_run:
    workflows: [Refresh recipe videos]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          # .well-known/apple-app-site-association (iOS Universal Links) and
          # .well-known/assetlinks.json (Android App Links) must deploy;
          # upload-pages-artifact v4 silently dropped dot-directories.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Pings IndexNow with the URLs whose sitemap <lastmod> changed since the
  # previous commit (scripts/indexnow.mjs), not the whole site. Set the
  # repository variable INDEXNOW to "off" to skip it.
  notify-indexnow:
    if: vars.INDEXNOW != 'off'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The previous commit's date is the cut-off for "changed".
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate sitemaps
        run: npx tsx scripts/generate-public-index.ts
      - name: Submit changed URLs to IndexNow
        run: |
          since=$(git log -1 --format=%cs HEAD~1 2>/dev/null || git log -1 --format=%cs HEAD)
          npm run indexnow -- --since="$since"
