name: Deploy fifi.cooking to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-deploy after the weekly video-refresh workflow commits new results.
  workflow_run:
    workflows: [Refresh recipe videos]
    types: [completed]
    branches: [main]

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build site
        run: npm run build
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fifi-cooking --commit-dirty=true

  # Pings IndexNow with the URLs whose sitemap <lastmod> changed since the
  # previous commit (scripts/indexnow.mjs), not the whole site. Set the
  # repository variable INDEXNOW to "off" to skip it.
  notify-indexnow:
    if: |
      vars.INDEXNOW != 'off' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate sitemaps
        run: npx tsx scripts/generate-public-index.ts

      - name: Submit changed URLs to IndexNow
        run: |
          since=$(git log -1 --format=%cs HEAD~1 2>/dev/null || git log -1 --format=%cs HEAD)
          npm run indexnow -- --since="$since"
