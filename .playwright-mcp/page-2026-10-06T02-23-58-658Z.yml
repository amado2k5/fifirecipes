    - generic [ref=e61]:
      - heading "The six roles" [level=2] [ref=e62]
      - generic [ref=e63]:
        - generic [ref=e64]:
          - heading "Clients" [level=3] [ref=e65]
          - paragraph [ref=e66]: One interface over HTTP and over a simulated executor. Retries reuse the Idempotency-Key, so a request is never cooked twice; stop is retried until it lands.
        - generic [ref=e67]:
          - heading "Agents" [level=3] [ref=e68]
          - paragraph [ref=e69]: "A planner acting under a signed mandate: scope, expiry and a confirm-before list. It never works around an allergen block and asks a person before anything irreversible. A monitor checks every state transition and temperature."
        - generic [ref=e70]:
          - heading "Orchestrators" [level=3] [ref=e71]
          - paragraph [ref=e72]: "Gates first, then a dry run on every device. The device that needs the fewest people wins. Start, poll, recover, collect the log, report. Optional by design: Cookwala works without one."
        - generic [ref=e73]:
          - heading "Gates" [level=3] [ref=e74]
          - paragraph [ref=e75]: Core version, recipe hash, recall, mandate, allergen, untrusted text, envelope and local limits, attendance, device capability. The first refusal stops the request; a gate that fails refuses.
        - generic [ref=e76]:
          - heading "Recovery" [level=3] [ref=e77]
          - paragraph [ref=e78]: Never retry around safety. A busy or unable device sends the request to the next one. A person is asked when needed; if nobody answers, it stops. After heat, a failed run means discard and report.
        - generic [ref=e79]:
          - heading "Reporting" [level=3] [ref=e80]
          - paragraph [ref=e81]: "A record per run and a summary, as JSON, Markdown, JUnit XML for CI dashboards, or CSV. Incident reports are anonymous: a date, no names, a random id."
