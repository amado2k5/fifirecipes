    - region [ref=e159]:
      - generic [ref=e160]:
        - heading "It started with a family cookbook" [level=2] [ref=e161]
        - paragraph [ref=e162]: Cookwala began with a family archive of Egyptian home cooking, the recipes of Dr. Fatma Alkawokgy (1943 to 2026), published at fifi.cooking in 25 languages. They were written for people. "Fry until golden." "Add water to cover." "Let it simmer until it is ready." Anyone who grew up in that kitchen knows exactly what those lines mean. A machine does not, and neither does a stranger. When one of those dishes was described so that an oven, a robot or a food bank could check it before cooking, it turned out that nobody had written down what "simmer" is, when chicken is safe, or when a step must be refused. Cookwala is the attempt to write that down, in the open, so that the dishes outlive the machines and the machines refuse rather than guess.
        - paragraph [ref=e163]:
          - text: —
          - link "the founder" [ref=e164] [cursor=pointer]:
            - /url: https://github.com/amado2k5
    - region [ref=e165]:
      - heading "Why now" [level=2] [ref=e166]
      - generic [ref=e167]:
        - paragraph [ref=e168]: Home robots are shipping and kitchen robots are taking orders. Each maker writes its own closed recipes, mostly from a few cuisines, and decides alone what "simmer" or "done" means.
        - paragraph [ref=e169]: Unsafe food causes about 600 million illnesses a year measured · WHO. About 14 % of food is lost before it reaches a shop measured · FAO, while about 733 million people faced hunger in 2023 measured · SOFI 2024.
        - paragraph [ref=e170]:
          - text: "Cookwala is the shared, open layer: one way to describe a recipe that a person, a food bank, an oven or a humanoid can read, check and cook safely, in every cuisine, with the cook's name on it."
          - link "Why this, why now" [ref=e171] [cursor=pointer]:
            - /url: /why/
          - text: ·
          - link "Impact, with sources" [ref=e172] [cursor=pointer]:
            - /url: /impact/
      - paragraph [ref=e173]:
        - text: "Three goals — help end hunger, make people healthier, put robots to work for people — each told with its measured problem, what exists now, and what we will never claim:"
        - link "How this helps →" [ref=e174] [cursor=pointer]:
          - /url: /goals/
