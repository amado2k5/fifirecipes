        - generic [ref=e273]:
          - heading "Safe by design, verifiable by anyone" [level=2] [ref=e274]
          - paragraph [ref=e275]:
            - text: Safety is enforced on the device, not in the cloud. No recipe, agent, message or extension can raise a device's limits, and a local stop works without a network. AI agents act only under a signed
            - term [ref=e276]: mandate
            - generic [ref=e277]: ": a signed permission from a person that says what an AI agent may do for them, with limits and an expiry"
            - text: and treat every text field as data, never as instructions.
          - paragraph [ref=e278]:
            - text: Every recipe and record can be hashed and signed, keys can be revoked, and event logs carry witnessed
            - term [ref=e279]: checkpoints
            - generic [ref=e280]: ": a signed summary of an event log that witnesses counter-sign, so a later rewrite can be detected"
            - text: ". The tests that prove it are public: 137 vectors."
          - paragraph [ref=e281]:
            - link "Read Core 0.2" [ref=e282] [cursor=pointer]:
