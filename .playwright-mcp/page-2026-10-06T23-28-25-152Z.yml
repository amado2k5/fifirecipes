    - region [ref=f1e157]:
      - generic [ref=f1e158]:
        - heading "بدأت بكتاب طبخ عائلي" [level=2] [ref=f1e159]
        - paragraph [ref=f1e160]: بدأ كوكوالا بأرشيف عائلي للطبخ المنزلي المصري، وصفات الدكتورة فاطمة القواقجي (1943 إلى 2026)، المنشور على fifi.cooking بخمس وعشرين لغة. كُتبت للناس. «اقلِ حتى يصفرّ.» «أضف ماءً حتى يغمر.» «دعه على نار هادئة حتى يستوي.» كل من نشأ في ذلك المطبخ يعرف تمامًا معنى هذه الجمل. أما الآلة فلا تعرف، ولا الغريب. وحين وُصف طبق منها بحيث يستطيع فرن أو روبوت أو بنك طعام فحصه قبل الطهي، تبيّن أن أحدًا لم يكتب ما هو «النار الهادئة»، ولا متى يكون الدجاج آمنًا، ولا متى يجب رفض خطوة. كوكوالا هو محاولة كتابة ذلك علنًا، لتبقى الأطباق بعد الآلات، ولترفض الآلات بدل أن تخمّن.
        - paragraph [ref=f1e161]:
          - text: —
          - link "المؤسِّس" [ref=f1e162] [cursor=pointer]:
            - /url: https://github.com/amado2k5
    - region [ref=f1e163]:
      - heading "لماذا الآن" [level=2] [ref=f1e164]
      - generic [ref=f1e165]:
        - paragraph [ref=f1e166]: روبوتات المنازل تُشحن وروبوتات المطابخ تتلقى الطلبات. يكتب كل صانع وصفاته المغلقة، من بضعة مطابخ غالبًا، ويقرر وحده ما معنى «نار هادئة» أو «نضج».
        - paragraph [ref=f1e167]: يسبب الطعام غير الآمن نحو 600 مليون حالة مرض سنويًا مُحصى · WHO. ونحو 14٪ من الطعام يُفقد قبل أن يصل إلى المتجر مُحصى · FAO، بينما واجه نحو 733 مليون شخص الجوع في 2023 مُحصى · SOFI 2024.
        - paragraph [ref=f1e168]:
          - text: "كوكوالا هو الطبقة المفتوحة المشتركة: طريقة واحدة لوصف وصفة يستطيع الإنسان وبنك الطعام والفرن والروبوت قراءتها والتحقق منها وطهيها بأمان، من كل المطابخ، وباسم الطباخ عليها."
