    <script>
      // Apply the visitor's language (?lang= link, else the saved choice) to <html> before first paint,
      // so a reload does not flash the default Arabic/RTL page. Keep in sync with src/utils/languagePreference.ts.
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('lang');
          var l = q || localStorage.getItem('fifi.lang');
          if (l && /^[a-z]{2}$/.test(l)) {
            document.documentElement.lang = l;
            document.documentElement.dir = ['ar', 'fa', 'ur', 'ps', 'he'].indexOf(l) >= 0 ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
      // Self-referencing canonical and the hreflang cluster of the URL being viewed. GitHub Pages serves this
      // same file for every ?lang= / ?recipe= URL, so a fixed canonical would fold every language into the root.
      // A recipe's own-language URL is its static page /recipe/<id>/; the app refines the cluster once the recipe
      // has loaded (src/utils/seoHead.ts). Keep the language list in sync with src/data/translations.ts.
      (function () {
        try {
          var origin = 'https://fifi.cooking';
          var langs = 'ar en fr es ja hi pt ru zh de it el ur fa tr ku id sw ko nl ps he pl sv te bn vi sq cs ro'.split(' ');
          var q = new URLSearchParams(location.search);
          var lang = langs.indexOf(q.get('lang')) >= 0 ? q.get('lang') : null;
          var recipe = q.get('recipe');
          var canonical;
          if (recipe && /^[A-Za-z0-9_-]+$/.test(recipe)) {
            var page = origin + '/recipe/' + encodeURIComponent(recipe) + '/';
            var links = document.querySelectorAll('link[rel="alternate"][hreflang]');
            for (var i = 0; i < links.length; i++) links[i].parentNode.removeChild(links[i]);
            for (var j = 0; j < langs.length; j++) {
              var alt = document.createElement('link');
              alt.rel = 'alternate';
              alt.hreflang = langs[j];
              alt.href = origin + '/?recipe=' + encodeURIComponent(recipe) + '&lang=' + langs[j];
              document.head.appendChild(alt);
            }
            var def = document.createElement('link');
            def.rel = 'alternate';
            def.hreflang = 'x-default';
            def.href = page;
            document.head.appendChild(def);
            canonical = lang ? origin + '/?recipe=' + encodeURIComponent(recipe) + '&lang=' + lang : page;
          } else {
            canonical = lang ? origin + '/?lang=' + lang : origin + '/';
          }
          var link = document.createElement('link');
          link.rel = 'canonical';
          link.href = canonical;
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
